[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dabao-ocr"
description = "离线 OCR 后端 —— Umi-OCR 衍生的 agent 友好工具包（RapidOCR-json 引擎）"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dabao (Xiaobao) Company" }]
keywords = ["ocr", "offline", "rapidocr", "umi-ocr", "agent", "chinese"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Text Processing",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
dev = ["pytest>=8", "PyMuPDF>=1.24"]

[project.scripts]
dabao-ocr = "dabao_ocr.cli:main"

[tool.setuptools.packages.find]
include = ["dabao_ocr*"]

[tool.setuptools.package-data]
dabao_ocr = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "dabao_ocr._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# 只开高价值规则：F=未使用/未定义，E9=语法，B=易错写法，UP=过时语法
select = ["F", "E9", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "B008"]
